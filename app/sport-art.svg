<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Арсений в движении</title>
  <desc id="desc">Оригинальная спортивная иллюстрация: юный бегущий атлет, линии площадки и яркие дуги движения.</desc>
  <defs>
    <linearGradient id="shirt" x1="287" y1="177" x2="373" y2="342" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF9EB"/><stop offset=".55" stop-color="#EBE7D9"/><stop offset="1" stop-color="#A9B6B3"/></linearGradient>
    <linearGradient id="skin" x1="313" y1="119" x2="375" y2="239" gradientUnits="userSpaceOnUse"><stop stop-color="#E6B99A"/><stop offset="1" stop-color="#B98268"/></linearGradient>
    <linearGradient id="leg" x1="314" y1="330" x2="369" y2="472" gradientUnits="userSpaceOnUse"><stop stop-color="#C7977E"/><stop offset="1" stop-color="#E6BC9C"/></linearGradient>
    <linearGradient id="shorts" x1="296" y1="291" x2="381" y2="371" gradientUnits="userSpaceOnUse"><stop stop-color="#394A55"/><stop offset="1" stop-color="#142833"/></linearGradient>
    <linearGradient id="shoe" x1="337" y1="471" x2="413" y2="486" gradientUnits="userSpaceOnUse"><stop stop-color="#EBFF9B"/><stop offset=".52" stop-color="#C6F63D"/><stop offset="1" stop-color="#8EB922"/></linearGradient>
    <linearGradient id="court" x1="259" y1="426" x2="344" y2="596" gradientUnits="userSpaceOnUse"><stop stop-color="#83B8B8" stop-opacity=".28"/><stop offset="1" stop-color="#83B8B8" stop-opacity="0"/></linearGradient>
    <linearGradient id="arc" x1="124" y1="181" x2="502" y2="426" gradientUnits="userSpaceOnUse"><stop stop-color="#D5FF61" stop-opacity="0"/><stop offset=".45" stop-color="#D5FF61"/><stop offset="1" stop-color="#D5FF61" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#C8FF57" stop-opacity=".14"/><stop offset="1" stop-color="#C8FF57" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-90%" width="180%" height="280%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!-- A translucent court and oversized track arc supply depth without a boxed image. -->
